name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff + mypy annotations)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: ruff (inline annotations, non-blocking)
        continue-on-error: true
        run: ruff check --output-format=github .

      - name: mypy (inline annotations, non-blocking)
        # mypy is configured for python_version 3.11 (pyproject.toml). Kept
        # non-blocking so type findings surface as annotations without failing
        # the job; promote to blocking once the codebase is fully typed.
        # --output-format=github removed: mypy 2.x dropped it (Usage error → Exit 2);
        # default output already emits "path:line: error:" lines GitHub parses.
        continue-on-error: true
        run: mypy src

  test:
    name: Tests (pytest + UI Jest + Overlay build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Python tests (pytest)
        run: python -m pytest -q

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            src/UI/static/package-lock.json
            src/Overlay_project/package-lock.json

      - name: UI Jest tests
        run: |
          cd src/UI/static
          npm ci
          npm test

      - name: Overlay JS build
        run: |
          cd src/Overlay_project
          npm ci
          npm run build
