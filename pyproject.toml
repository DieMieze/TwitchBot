[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twitchbot-runtime"
version = "0.1.0"
description = "Modular Twitch event runtime with a triggers -> reactions pipeline."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2",
    "requests>=2.28",
]

[project.optional-dependencies]
overlay = [
    "flask>=3",
    "flask-socketio>=5",
    "pillow>=10",
]
dev = [
    "pytest>=7",
    "pytest-mock>=3",
]
all = [
    "flask>=3",
    "flask-socketio>=5",
    "pillow>=10",
    "pytest>=7",
    "pytest-mock>=3",
]

[project.scripts]
twitchbot-runtime = "twitchbot_runtime.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
twitchbot_runtime = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "E731"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["src/Overlay_project/"]
